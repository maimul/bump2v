[bumpversion]
current_version = 1.11.1
commit = True
tag = True
message = Version Updated: {current_version} → {new_version} 🚀

[bumpversion:file:pyproject.toml]

[bumpversion:file:bump2v/__init__.py]
search = __version__ = "{current_version}"
replace = __version__ = "{new_version}"

[bumpversion:file:templates/release.yml]
search = ghcr.io/maimul/bump2v:{current_version}
replace = ghcr.io/maimul/bump2v:{new_version}

[bumpversion:file:templates/check.yml]
search = ghcr.io/maimul/bump2v:{current_version}
replace = ghcr.io/maimul/bump2v:{new_version}

[bumpversion:file:README.md]
search = v{current_version}
replace = v{new_version}

[bumpversion:file:README.rst]
search = v{current_version}
replace = v{new_version}

[bumpversion:file:website/ci/gitlab.md]
search = bump2v/v{current_version}/
replace = bump2v/v{new_version}/

[bumpversion:file:website/ci/other.md]
search = bump2v:{current_version}
replace = bump2v:{new_version}
