# The docs site (https://maimul.github.io/bump2v/), built with Zensical from website/.
# Build locally: pip install zensical==0.0.73 && zensical build --strict  (output: site/)
# The reference (every command, flag, config key, exit code) stays in README.md.

[project]
site_name = "bump2v"
site_description = "Version every file, commit, tag and push in one command, from any language and any CI."
site_url = "https://maimul.github.io/bump2v/"
repo_url = "https://github.com/maimul/bump2v"
repo_name = "maimul/bump2v"
edit_uri = "edit/main/website/"
docs_dir = "website"
copyright = "MIT licensed"
nav = [
  { "Get started" = "index.md" },
  { "Your stack" = "stacks.md" },
  { "CI" = [
    { "GitHub Actions" = "ci/github-actions.md" },
    { "GitLab CI/CD" = "ci/gitlab.md" },
    { "Any other CI" = "ci/other.md" },
  ] },
  { "AI coding agents" = "agents.md" },
  { "Coming from bump2version" = "migrate.md" },
  { "Reference (README)" = "https://github.com/maimul/bump2v#commands" },
]

[project.theme]
language = "en"
features = [
  "content.code.copy",
  "content.tabs.link",
  "navigation.footer",
  "navigation.sections",
  "navigation.top",
  "search.highlight",
]

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[project.markdown_extensions]
admonition = {}
attr_list = {}
md_in_html = {}
toc.permalink = true
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.inlinehilite = {}
pymdownx.superfences = {}
pymdownx.tabbed.alternate_style = true
