[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bump2v"
version = "1.8.1"
description = "This is a package to bump version numbers in a project. Fully automated versioning. Refer to bump2version package instructions."
readme = "README.rst"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = []

classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Software Development :: Version Control :: Git",
]

keywords = [
    "alternative", "version", "versioning", "bump2version", "automate",
    "python", "deployment", "devops", "dev", "ops", "automation", "bump", "versioning",
]

[project.optional-dependencies]
test = ["pytest"]

[project.urls]
Homepage = "https://github.com/maimul/bump2v"

[project.scripts]
bumptydumpty = "bump2v.__main__:main"
versionkaboom = "bump2v.__main__:main"
bump2v = "bump2v.__main__:main"

[tool.setuptools.packages.find]
include = ["bump2v", "bump2v.*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
