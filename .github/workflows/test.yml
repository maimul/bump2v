# Runs the test suite on every push to main and every pull request,
# across the Python versions and operating systems bump2v supports.

name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run tests
        run: pytest --tb=short -q

  encoding:
    # Windows reads and writes text in the console codepage unless the code says UTF-8.
    # Fail on any open()/read_text()/write_text() that relies on the default, on every push.
    name: Explicit text encodings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .
      - run: python -X warn_default_encoding -m pytest -q -W error::EncodingWarning

  pre-commit-hook:
    # The hook in .pre-commit-hooks.yaml, installed by pre-commit from this checkout:
    # it must pass a repo whose files hold current_version and fail one that drifted.
    name: pre-commit hook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Passes in line, fails on drift
        run: |
          pip install pre-commit
          pre-commit validate-manifest .pre-commit-hooks.yaml
          repo="$RUNNER_TEMP/hook-fixture"
          git init -q -b main "$repo" && cd "$repo"
          git config user.name ci && git config user.email ci@example.com
          printf '[bumpversion]\ncurrent_version = 0.1.0\n\n[bumpversion:file:package.json]\nsearch = "version": "{current_version}"\nreplace = "version": "{new_version}"\n' > .bumpversion.cfg
          printf '{\n  "name": "fixture",\n  "version": "0.1.0"\n}\n' > package.json
          git add -A && git commit -qm init
          pre-commit try-repo "$GITHUB_WORKSPACE" bump2v-check --all-files
          sed -i 's/"version": "0.1.0"/"version": "0.1.1"/' package.json
          if out=$(pre-commit try-repo "$GITHUB_WORKSPACE" bump2v-check --all-files 2>&1); then
            echo "$out"; echo "::error::the hook passed a package.json that drifted"; exit 1
          fi
          echo "$out"
          echo "$out" | grep -q 'MISSING  package.json'
