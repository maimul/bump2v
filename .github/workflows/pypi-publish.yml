# Publishes to PyPI on every version tag push (v1.10.0).
# Tests must pass before the package is built and uploaded.
# Upload uses PyPI Trusted Publishing (OIDC): no stored API token, and PyPI
# records PEP 740 attestations for each file.
# Once the upload succeeds, the version gets a GitHub Release, the moving major tag
# (v1) points at it, so `uses: maimul/bump2v@v1` runs the newest 1.x, and its
# container image goes to ghcr.io/maimul/bump2v.

name: Upload Python Package

on:
  push:
    tags:
      # Version tags only: the moving major tag (v1) must not start a publish.
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    name: Tests before publish (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.11', '3.x']
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e .

      - name: Run tests
        run: pytest --tb=short -q

  deploy:
    name: Build and publish
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/bump2v/
    permissions:
      contents: read
      id-token: write  # Trusted Publishing; also signs the attestations

    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # v1.14.3

  github-release:
    name: GitHub Release and the major tag
    needs: deploy  # only versions that reached PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # the previous release, and every tag in this major

      # A backport (v1.9.3 after v1.10.0) leaves v1 where it is.
      - name: Point the major tag at this release
        run: |
          major="${TAG%%.*}"
          newest=$(git tag --list "$major.*" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1)
          if [ "$newest" != "$TAG" ]; then
            echo "$major stays where it is: $newest is newer than $TAG."
            exit 0
          fi
          git tag -f "$major" "$TAG^{commit}"
          git push -f origin "refs/tags/$major"

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists."
            exit 0
          fi
          prev=$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' "$TAG^" 2>/dev/null || true)
          notes=""
          if [ -n "$prev" ]; then
            # Skip the version commits and the working-board updates.
            notes=$(git log --no-merges --format='- %s' "$prev..$TAG" \
              | grep -v -e '^- Version Updated: ' -e '^- chore: tracker' || true)
          fi
          gh release create "$TAG" --verify-tag --title "$TAG" --notes "$notes" --generate-notes

  image:
    name: Container image
    needs: deploy  # only versions that reached PyPI
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      TAG: ${{ github.ref_name }}
      IMAGE: ghcr.io/maimul/bump2v
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # every version tag, to tell whether this one is the newest

      # 1.10.0, plus 1.10, 1 and latest when no newer version holds them: a backport
      # (1.9.3 after 1.10.0) gets only its own tag.
      - name: Image tags
        id: tags
        run: |
          version="${TAG#v}"
          newest() {
            git tag --list "$1" | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true
          }
          tags="$IMAGE:$version"
          for alias in "${version%.*}" "${version%%.*}"; do
            if [ "$(newest "v$alias.*")" = "$TAG" ]; then tags="$tags,$IMAGE:$alias"; fi
          done
          if [ "$(newest 'v*')" = "$TAG" ]; then tags="$tags,$IMAGE:latest"; fi
          echo "Tags: $tags"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6  # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push (amd64 and arm64)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: org.opencontainers.image.version=${{ steps.tags.outputs.version }}
